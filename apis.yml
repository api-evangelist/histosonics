name: HistoSonics
description: HistoSonics is a medical device company commercializing histotripsy, a non-invasive,
  non-thermal and non-ionizing sonic beam therapy that uses focused ultrasound to form a controlled
  bubble cloud which mechanically destroys and liquefies targeted tissue at a sub-cellular level.
  Its robotically assisted Edison Histotripsy System received U.S. FDA marketing authorization
  through the De Novo Classification Request process in October 2023 for the non-invasive
  destruction of liver tumors, making it the first histotripsy platform authorized anywhere in the
  world, and has since added CE Mark authorization in Europe and an FDA submission covering kidney
  tumors. The underlying science originated with researchers at the University of Michigan, and the
  company maintains clinical partnerships with the University of Michigan and the University of
  Wisconsin. HistoSonics publishes no public developer portal, API documentation, SDK, or
  machine-readable API specification; its public web surface is a marketing, clinical-evidence,
  physician-education and eIFU site rather than an API platform.
